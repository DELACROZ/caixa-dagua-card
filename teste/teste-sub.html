<!doctype html><html><head><meta charset="utf-8">
<style>body{background:#111;margin:0;padding:20px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
ha-card{display:block;background:#1c1c1c;border-radius:12px}:root{--primary-text-color:#e1e1e1;--secondary-text-color:#9b9b9b}</style>
<script type="module" src="../dist/caixa-dagua-card.js"></script></head><body>
<script type="module">
await customElements.whenDefined("caixa-dagua-card");
const t=new Date().toISOString(), st={};
for (const v of [5,46,80,100]) st["sensor.s"+v]={state:String(v),last_updated:t,attributes:{friendly_name:"Subterrânea "+v+"%",unit_of_measurement:"%"}};
for (const v of [5,46,80,100]) { const c=document.createElement("caixa-dagua-card"); c.setConfig({entity:"sensor.s"+v,tipo:"subterranea"}); document.body.append(c); c.hass={states:st}; }
</script></body></html>
